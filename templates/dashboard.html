<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f5f6f8;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }

        .card small {
            color: #6b7280;
            display: block;
            margin-bottom: 10px;
        }

        .card strong {
            font-size: 32px;
        }

        .total { border-left: 5px solid #334155; }
        .recebido { border-left: 5px solid #3b82f6; }
        .andamento { border-left: 5px solid #f59e0b; }
        .concluido { border-left: 5px solid #10b981; }
        .alta { border-left: 5px solid #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">
            <div>
                <h1>Dashboard</h1>
                <div>Técnico logado: <strong>{{ tecnico }}</strong></div>
            </div>

            <a class="btn" href="/">Voltar ao painel</a>
        </div>

        <div class="cards">
            <div class="card total">
                <small>Total</small>
                <strong>{{ total }}</strong>
            </div>

            <div class="card recebido">
                <small>Recebidos</small>
                <strong>{{ recebido }}</strong>
            </div>

            <div class="card andamento">
                <small>Em atendimento</small>
                <strong>{{ atendimento }}</strong>
            </div>

            <div class="card concluido">
                <small>Concluídos</small>
                <strong>{{ concluido }}</strong>
            </div>

            <div class="card alta">
                <small>Prioridade Alta</small>
                <strong>{{ alta }}</strong>
            </div>
        </div>
    </div>
</body>
</html>
